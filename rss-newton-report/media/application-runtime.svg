<svg aria-labelledby="app-title" role="img" viewbox="0 0 960 370" xmlns="http://www.w3.org/2000/svg"><title id="app-title">Proposed convergence of Python and USD construction at an application-owned Newton runtime</title><style>text{font-family:system-ui;fill:#253343;font-size:17px}.bx{fill:#f3f5f7;stroke:#8091a3}.arr{stroke:#617285;stroke-width:2;fill:none}.sm{font-size:14px}</style><rect class="bx" height="80" rx="5" width="285" x="15" y="15"></rect><text x="34" y="45">Python construction</text><text class="sm" x="34" y="73">ModelBuilder / optional RSS recipe</text><rect class="bx" height="80" rx="5" width="285" x="337" y="15"></rect><text x="356" y="45">USD construction</text><text class="sm" x="356" y="73">Newton importer / ovnewton adapter</text><rect class="bx" height="80" rx="5" width="285" x="659" y="15"></rect><text x="678" y="45">Existing application</text><text class="sm" x="678" y="73">Borrow Lab or Example resources</text><path class="arr" d="M155 95V123H480V150M480 95V150M803 95V123H480"></path><rect class="bx" height="95" rx="5" width="660" x="150" y="151"></rect><text x="173" y="183">One application owns model, states, control and solver(s)</text><text class="sm" x="173" y="211">step / render · reset or rebuild · generation · edit notifications</text><text class="sm" x="173" y="233">Solver recipe and lifecycle contract: proposed work, not a new API today</text><path class="arr" d="M480 246V273H157V291M480 273V291M480 273H803V291"></path><rect class="bx" height="58" rx="5" width="285" x="15" y="292"></rect><text x="44" y="327">RSS panels / Viser</text><rect class="bx" height="58" rx="5" width="285" x="337" y="292"></rect><text x="369" y="327">Agent commands / MCP</text><rect class="bx" height="58" rx="5" width="285" x="659" y="292"></rect><text x="696" y="327">Tests / recording</text></svg>